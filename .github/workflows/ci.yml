name: Node.js CI

on:
  push:
    branches: [ "Assignment1"]
  pull_request:
    branches: [ "Assignment1" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js latest
      uses: actions/setup-node@v4
      with:
        node-version: 'latest'
        cache: 'npm'
    - run: npm ci
    - run: npm test
